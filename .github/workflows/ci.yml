name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wepush
          POSTGRES_PASSWORD: wepush
          POSTGRES_DB: wepush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wepush -d wepush_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TZ: UTC
      TEST_DATABASE_URL: postgres://wepush:wepush@localhost:5432/wepush_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migration drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git ls-files --others --exclude-standard -- packages/db/migrations)"
      - run: pnpm test --coverage
      - run: pnpm build
