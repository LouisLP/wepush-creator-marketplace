name: wepush

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wepush
      POSTGRES_PASSWORD: wepush
      POSTGRES_DB: wepush
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wepush -d wepush]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
